# Manually triggered workflow to publish the P2PNet NuGet package.
# Reads the version directly from the .csproj — no VERSION.txt needed.

name: Publish NuGet Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -nowarn:all

    - name: Publish NuGet package
      run: dotnet nuget push **/*.nupkg --source "https://api.nuget.org/v3/index.json" --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }}
